<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Semua produk Beautylatory — Imelda Laksmi"
    />
    <meta name="theme-color" content="#ad4f7b" />
    <link rel="icon" type="image/x-icon" href="public/img/favicon.ico" />
    <title>Produk — Imelda Laksmi</title>
    <link rel="stylesheet" href="public/css/all.min.css" />
    <style>
      :root {
        --pink-primary: #c17299;
        --pink-medium: #b36e90;
        --pink-soft: #ca84a9;
        --pink-light: #cd90b1;
        --pink-deep: #ad4f7b;
        --white: #ffffff;
        --text-dark: #ffffff;
        --text-mid: #cd90b1;
        --text-muted: #ca84a9;
        --border-soft: rgba(193, 114, 153, 0.25);
        --border-hover: rgba(193, 114, 153, 0.55);
        --bg-card: rgba(173, 79, 123, 0.18);
        --bg-card-hover: rgba(179, 110, 144, 0.28);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        min-height: 100vh;
        background: #2a1020;
        color: var(--text-dark);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          160deg,
          rgba(173, 79, 123, 0.55) 0%,
          rgba(42, 16, 32, 0.95) 60%,
          rgba(20, 8, 16, 1) 100%
        );
        z-index: 0;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle 380px at 10% 10%,
            rgba(193, 114, 153, 0.18) 0%,
            transparent 70%
          ),
          radial-gradient(
            circle 300px at 90% 80%,
            rgba(173, 79, 123, 0.15) 0%,
            transparent 70%
          );
        z-index: 0;
        pointer-events: none;
      }

      /* FLOATING HEARTS */
      .hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .heart {
        position: absolute;
        opacity: 0;
        animation: floatHeart linear infinite;
        color: rgba(205, 144, 177, 0.3);
      }
      .heart:nth-child(1) {
        left: 8%;
        font-size: 12px;
        animation-duration: 8s;
        animation-delay: 0s;
      }
      .heart:nth-child(2) {
        left: 22%;
        font-size: 16px;
        animation-duration: 10s;
        animation-delay: 2s;
      }
      .heart:nth-child(3) {
        left: 38%;
        font-size: 10px;
        animation-duration: 7s;
        animation-delay: 4s;
      }
      .heart:nth-child(4) {
        left: 56%;
        font-size: 14px;
        animation-duration: 9s;
        animation-delay: 1s;
      }
      .heart:nth-child(5) {
        left: 72%;
        font-size: 12px;
        animation-duration: 11s;
        animation-delay: 3s;
      }
      .heart:nth-child(6) {
        left: 88%;
        font-size: 10px;
        animation-duration: 8s;
        animation-delay: 5s;
      }

      @keyframes floatHeart {
        0% {
          bottom: -20px;
          opacity: 0;
          transform: translateX(0) rotate(0deg);
        }
        10% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.2;
        }
        100% {
          bottom: 110%;
          opacity: 0;
          transform: translateX(25px) rotate(15deg);
        }
      }

      /* WRAPPER */
      .page-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .frame {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        padding: 36px 22px 64px;
        background:
          linear-gradient(
            160deg,
            rgba(173, 79, 123, 0.72) 0%,
            rgba(42, 16, 32, 0.88) 60%,
            rgba(20, 8, 16, 0.95) 100%
          ),
          url("public/img/Background.png") center center / cover no-repeat;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
      }

      @media (min-width: 520px) {
        .page-wrapper {
          padding: 36px 16px 48px;
        }
        .frame {
          min-height: unset;
          border-radius: 32px;
          border: 1px solid rgba(193, 114, 153, 0.2);
          box-shadow: 0 8px 48px rgba(0, 0, 0, 0.6);
        }
      }

      /* NAV ATAS */
      .nav-atas {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
        animation: fadeUp 0.5s ease-out;
      }

      .tombol-kembali {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--bg-card);
        border: 1.5px solid var(--border-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-mid);
        font-size: 15px;
        text-decoration: none;
        transition: all 0.25s ease;
        flex-shrink: 0;
        backdrop-filter: blur(8px);
      }

      .tombol-kembali:hover {
        background: var(--pink-deep);
        border-color: var(--pink-deep);
        color: #fff;
        transform: translateX(-2px);
      }

      .nav-judul {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
      }
      .nav-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* GRID PRODUK */
      .grid-produk {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .kartu-produk {
        display: flex;
        flex-direction: column;
        background: var(--bg-card);
        border: 1.5px solid var(--border-soft);
        border-radius: 20px;
        text-decoration: none;
        color: #fff;
        overflow: hidden;
        transition: all 0.25s ease;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: fadeUp 0.6s ease-out backwards;
      }

      .kartu-produk:nth-child(1) {
        animation-delay: 0.05s;
      }
      .kartu-produk:nth-child(2) {
        animation-delay: 0.1s;
      }
      .kartu-produk:nth-child(3) {
        animation-delay: 0.15s;
      }
      .kartu-produk:nth-child(4) {
        animation-delay: 0.2s;
      }
      .kartu-produk:nth-child(5) {
        animation-delay: 0.25s;
      }
      .kartu-produk:nth-child(6) {
        animation-delay: 0.3s;
      }

      .kartu-produk:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow: 0 12px 28px rgba(173, 79, 123, 0.3);
      }

      .foto-wrap {
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background: linear-gradient(135deg, #6b2d50, #ad4f7b);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .foto-produk {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      .kartu-produk:hover .foto-produk {
        transform: scale(1.07);
      }

      .foto-fallback {
        font-size: 34px;
      }

      .info-produk {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .merek {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--pink-light);
      }

      .nama-produk {
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        line-height: 1.35;
      }

      .tombol-beli {
        margin-top: 6px;
        display: block;
        padding: 8px 0;
        background: rgba(173, 79, 123, 0.25);
        border-radius: 10px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--pink-light);
        transition: background 0.2s;
      }

      .kartu-produk:hover .tombol-beli {
        background: rgba(173, 79, 123, 0.45);
        color: #fff;
      }

      /* FOOTER */
      .footer {
        margin-top: 44px;
        text-align: center;
        animation: fadeUp 0.6s ease-out 0.35s backwards;
      }

      .footer-nama {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-mid);
        margin-bottom: 3px;
      }

      .footer-copy {
        font-size: 10px;
        color: var(--pink-medium);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="hearts">
      <span class="heart">🌸</span>
      <span class="heart">💕</span>
      <span class="heart">🌸</span>
      <span class="heart">✨</span>
      <span class="heart">💕</span>
      <span class="heart">🌸</span>
    </div>

    <div class="page-wrapper">
      <div class="frame">
        <!-- NAV ATAS -->
        <nav class="nav-atas">
          <a href="index.html" class="tombol-kembali" aria-label="Kembali">
            <i class="fa-solid fa-arrow-left"></i>
          </a>
          <div>
            <div class="nav-judul">Spill Produk ✨</div>
            <div class="nav-sub">Semua rekomendasi Beautylatory</div>
          </div>
        </nav>

        <!-- GRID PRODUK -->
        <div class="grid-produk">
          <!-- Shampoo -->
          <a
            href="https://id.shp.ee/FFBxSWnq"
            class="kartu-produk"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="foto-wrap">
              <img
                src="public/img/shampoo.png"
                alt="Beautylatory Shampoo"
                class="foto-produk"
                onerror="
                  this.style.display = 'none';
                  this.nextElementSibling.style.display = 'block';
                "
              />
              <span class="foto-fallback" style="display: none">🧴</span>
            </div>
            <div class="info-produk">
              <div class="merek">Beautylatory</div>
              <div class="nama-produk">Shampoo</div>
              <span class="tombol-beli">Beli di Shopee</span>
            </div>
          </a>

          <!-- Shower Gel -->
          <a
            href="https://id.shp.ee/r1MuUQzi"
            class="kartu-produk"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="foto-wrap">
              <img
                src="public/img/showergell.png"
                alt="Beautylatory Shower Gel"
                class="foto-produk"
                onerror="
                  this.style.display = 'none';
                  this.nextElementSibling.style.display = 'block';
                "
              />
              <span class="foto-fallback" style="display: none">🚿</span>
            </div>
            <div class="info-produk">
              <div class="merek">Beautylatory</div>
              <div class="nama-produk">Shower Gel</div>
              <span class="tombol-beli">Beli di Shopee</span>
            </div>
          </a>

          <!-- Body Lotion -->
          <a
            href="https://id.shp.ee/jjNZ5AeT"
            class="kartu-produk"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="foto-wrap">
              <img
                src="public/img/bodylotion.png"
                alt="Beautylatory Body Lotion"
                class="foto-produk"
                onerror="
                  this.style.display = 'none';
                  this.nextElementSibling.style.display = 'block';
                "
              />
              <span class="foto-fallback" style="display: none">🌿</span>
            </div>
            <div class="info-produk">
              <div class="merek">Beautylatory</div>
              <div class="nama-produk">Body Lotion</div>
              <span class="tombol-beli">Beli di Shopee</span>
            </div>
          </a>

          <!-- Tambah produk baru: copy satu blok kartu-produk di atas -->
        </div>

        <!-- FOOTER -->
        <footer class="footer">
          <div class="footer-nama">Imelda Laksmi</div>
          <div class="footer-copy">© 2026 · Official Account</div>
        </footer>
      </div>
    </div>
  </body>
</html>
