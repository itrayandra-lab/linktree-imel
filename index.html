<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Imelda Laksmi - Official Account. Rekomendasi produk Beautylatory."
    />
    <meta name="theme-color" content="#432B27" />
    <title>Imelda Laksmi</title>
    <link rel="stylesheet" href="public/css/all.min.css" />
    <style>
      :root {
        --pink-soft: #f5cbd9;
        --pink-deep: #f89fb8;
        --text-dark: #ffffff;
        --text-mid: #f5cbd9;
        --text-muted: #d4b5b0;
        --border-soft: rgba(245, 203, 217, 0.15);
        --border-hover: rgba(245, 203, 217, 0.35);
        --bg-card: rgba(67, 43, 39, 0.55);
        --bg-card-hover: rgba(90, 61, 56, 0.7);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        min-height: 100vh;
        background: #3b2220;
        color: var(--text-dark);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          160deg,
          rgba(67, 43, 39, 0.92) 0%,
          rgba(45, 29, 26, 0.88) 100%
        );
        z-index: 0;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle 320px at 15% 15%,
            rgba(245, 203, 217, 0.07) 0%,
            transparent 70%
          ),
          radial-gradient(
            circle 260px at 85% 75%,
            rgba(90, 61, 56, 0.1) 0%,
            transparent 70%
          );
        z-index: 0;
        pointer-events: none;
      }

      /* FLOATING HEARTS */
      .hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .heart {
        position: absolute;
        opacity: 0;
        animation: floatHeart linear infinite;
        color: rgba(245, 203, 217, 0.25);
      }
      .heart:nth-child(1) {
        left: 8%;
        font-size: 12px;
        animation-duration: 8s;
        animation-delay: 0s;
      }
      .heart:nth-child(2) {
        left: 22%;
        font-size: 16px;
        animation-duration: 10s;
        animation-delay: 2s;
      }
      .heart:nth-child(3) {
        left: 38%;
        font-size: 10px;
        animation-duration: 7s;
        animation-delay: 4s;
      }
      .heart:nth-child(4) {
        left: 56%;
        font-size: 14px;
        animation-duration: 9s;
        animation-delay: 1s;
      }
      .heart:nth-child(5) {
        left: 72%;
        font-size: 12px;
        animation-duration: 11s;
        animation-delay: 3s;
      }
      .heart:nth-child(6) {
        left: 88%;
        font-size: 10px;
        animation-duration: 8s;
        animation-delay: 5s;
      }

      @keyframes floatHeart {
        0% {
          bottom: -20px;
          opacity: 0;
          transform: translateX(0) rotate(0deg);
        }
        10% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.2;
        }
        100% {
          bottom: 110%;
          opacity: 0;
          transform: translateX(25px) rotate(15deg);
        }
      }

      /* WRAPPER */
      .page-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .frame {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        padding: 48px 22px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(
          160deg,
          rgba(67, 43, 39, 0.45) 0%,
          rgba(45, 29, 26, 0.35) 100%
        );
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }

      @media (min-width: 520px) {
        .page-wrapper {
          padding: 36px 16px 48px;
        }
        .frame {
          min-height: unset;
          border-radius: 32px;
          border: 1px solid rgba(245, 203, 217, 0.08);
          box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
        }
      }

      /* HEADER */
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 24px;
        animation: fadeUp 0.6s ease-out;
      }

      .avatar-wrap {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid rgba(245, 203, 217, 0.3);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        margin-bottom: 14px;
        background: #5a3d38;
      }

      .avatar-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .nama {
        font-size: 22px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 6px;
        letter-spacing: 0.3px;
      }

      .tagline {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* BADGE SOSMED */
      .sosmed-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 36px;
        animation: fadeUp 0.6s ease-out 0.1s backwards;
      }

      .badge-sosmed {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--bg-card);
        border: 1.5px solid var(--border-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-mid);
        font-size: 19px;
        text-decoration: none;
        transition: all 0.25s ease;
        backdrop-filter: blur(8px);
      }

      .badge-sosmed:hover {
        background: var(--pink-soft);
        border-color: var(--pink-soft);
        color: #3b2220;
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(245, 203, 217, 0.25);
      }

      /* SECTION LABEL */
      .section-label {
        width: 100%;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
        position: relative;
        animation: fadeUp 0.6s ease-out backwards;
      }

      .section-label::before,
      .section-label::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 24px;
        height: 1px;
        background: var(--border-soft);
      }
      .section-label::before {
        right: calc(50% + 68px);
      }
      .section-label::after {
        left: calc(50% + 68px);
      }

      /* BANNER SPILL PRODUK */
      .banner-produk {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background: var(--bg-card);
        border: 1.5px solid var(--border-soft);
        border-radius: 20px;
        text-decoration: none;
        color: #fff;
        margin-bottom: 32px;
        transition: all 0.25s ease;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: fadeUp 0.6s ease-out 0.15s backwards;
        position: relative;
        overflow: hidden;
      }

      .banner-produk::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(245, 203, 217, 0.04),
          transparent
        );
        transform: translateX(-100%);
        transition: transform 0.5s ease;
      }

      .banner-produk:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-3px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }

      .banner-produk:hover::after {
        transform: translateX(100%);
      }

      .preview-thumbs {
        display: flex;
        flex-shrink: 0;
      }

      .preview-thumbs img {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        object-fit: cover;
        border: 2px solid rgba(42, 24, 21, 0.7);
        margin-left: -10px;
        background: #5a3d38;
      }

      .preview-thumbs img:first-child {
        margin-left: 0;
      }

      .banner-teks {
        flex: 1;
        min-width: 0;
      }

      .banner-label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--pink-deep);
        margin-bottom: 3px;
      }

      .banner-judul {
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 2px;
      }

      .banner-sub {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .banner-arrow {
        font-size: 20px;
        color: var(--pink-deep);
        flex-shrink: 0;
        transition:
          transform 0.25s ease,
          color 0.25s ease;
        line-height: 1;
      }

      .banner-produk:hover .banner-arrow {
        transform: translateX(4px);
        color: var(--pink-soft);
      }

      /* DAFTAR LAINNYA */
      .daftar-lain {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        animation: fadeUp 0.6s ease-out 0.2s backwards;
      }

      .link-lain {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 15px 18px;
        background: var(--bg-card);
        border: 1.5px solid var(--border-soft);
        border-radius: 16px;
        text-decoration: none;
        color: #fff;
        transition: all 0.25s ease;
        backdrop-filter: blur(12px);
      }

      .link-lain:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .link-lain-ikon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(245, 203, 217, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: var(--pink-deep);
        flex-shrink: 0;
      }

      .link-lain-teks {
        flex: 1;
      }

      .link-lain-label {
        font-size: 10px;
        color: var(--text-muted);
        margin-bottom: 1px;
      }

      .link-lain-judul {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
      }

      .link-lain-arrow {
        font-size: 16px;
        color: var(--pink-deep);
        transition:
          transform 0.25s ease,
          color 0.25s ease;
      }

      .link-lain:hover .link-lain-arrow {
        transform: translateX(3px);
        color: var(--pink-soft);
      }

      /* FOOTER */
      .footer {
        margin-top: 44px;
        text-align: center;
        animation: fadeUp 0.6s ease-out 0.3s backwards;
      }

      .footer-nama {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-mid);
        margin-bottom: 3px;
      }

      .footer-copy {
        font-size: 10px;
        color: #7a5550;
      }

      /* ANIMASI */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Floating hearts -->
    <div class="hearts">
      <span class="heart">🌸</span>
      <span class="heart">💕</span>
      <span class="heart">🌸</span>
      <span class="heart">✨</span>
      <span class="heart">💕</span>
      <span class="heart">🌸</span>
    </div>

    <div class="page-wrapper">
      <div class="frame">
        <!-- PROFIL -->
        <header class="header">
          <div class="avatar-wrap">
            <img
              src="public/img/profile.jpg"

        <!-- BADGE SOSMED -->
        <div class="sosmed-row">

          >
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a
            href="https://www.tiktok.com/@emilmeihwa?_r=1&_t=ZS-96D6bPqwS0H"
            class="badge-sosmed"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
          >
            <i class="fa-brands fa-tiktok"></i>
          </a>
          <a
            href="#"
            class="badge-sosmed"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <i class="fa-brands fa-facebook-f"></i>
          </a>
        </div>

        <!-- SPILL PRODUK -->
        <div class="section-label">Spill Produk</div>
        <a href="products.html" class="banner-produk">
          <div class="preview-thumbs">
            <img src="public/img/shampoo.png" alt="Shampoo" />
            <img src="public/img/showergell.png" alt="Shower Gel" />
            <img src="public/img/bodylotion.png" alt="Body Lotion" />
          </div>
          <div class="banner-teks">
            <div class="banner-label">Beautylatory</div>
            <div class="banner-judul">Lihat Semua Produk</div>
            <div class="banner-sub">Shampoo · Shower Gel · Body Lotion</div>
          </div>
          <span class="banner-arrow">›</span>
        </a>

        <!-- LAINNYA -->
        <div class="section-label">Lainnya</div>
        <div class="daftar-lain">
          <a
            href="https://shopee.co.id/"
            class="link-lain"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="link-lain-ikon">
              <i class="fa-brands fa-shopee"></i>
            </div>
            <div class="link-lain-teks">
              <div class="link-lain-label">Toko Resmi</div>
              <div class="link-lain-judul">Shopee Store</div>
            </div>
            <span class="link-lain-arrow">›</span>
          </a>

          <a
            href="https://www.instagram.com/emilmeihwa?igsh=MWoyYTlwODdqcm11dQ%3D%3D&utm_source=qr"
            class="link-lain"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="link-lain-ikon">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="link-lain-teks">
              <div class="link-lain-label">Kolaborasi & Endorse</div>
              <div class="link-lain-judul">DM via Instagram</div>
            </div>
            <span class="link-lain-arrow">›</span>
          </a>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
          <div class="footer-nama">Imelda Laksmi</div>
          <div class="footer-copy">© 2026 · Official Account</div>
        </footer>
      </div>
    </div>
  </body>
</html>
